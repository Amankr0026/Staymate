name: Deploy StayMate to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory does not exist!"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html does not exist!"
            exit 1
          fi

          echo "=== Contents of dist/index.html ==="
          cat dist/index.html
          echo ""

          echo "=== Generated dist assets ==="
          find dist -maxdepth 2 -type f

          if grep -q "/src/main.tsx" dist/index.html; then
            echo "Error: dist/index.html contains uncompiled source reference '/src/main.tsx'!"
            exit 1
          fi

          echo "Build verification passed: dist/index.html correctly references compiled production assets."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

